<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{carAdd.title}">Add car - PitStop Garage</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <style>
        .add-car-page {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }

        .add-car-card {
            border: 1px solid var(--line);
            border-radius: 1.8rem;
            background:
                    linear-gradient(155deg, rgba(255, 255, 255, 0.10), transparent 46%),
                    var(--panel);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .add-car-card h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 0.5rem;
        }

        .add-car-card .auth-copy {
            margin-bottom: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .form-actions .button {
            flex: 1;
            min-width: 140px;
            text-align: center;
        }

        select {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--line);
            border-radius: 0.9rem;
            color: var(--text);
            background: rgba(15, 23, 42, 0.88);
            outline: none;
        }

        select:focus {
            border-color: rgba(249, 115, 22, 0.72);
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12);
        }

        select.input-error {
            border-color: rgba(248, 113, 113, 0.85);
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.12);
        }

        .auth-form input.input-error,
        .auth-form select.input-error {
            border-color: rgba(248, 113, 113, 0.85);
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.12);
        }

        .field-error {
            display: block;
            line-height: 1.4;
        }

        .vin-row {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0.65rem;
        }

        .vin-row .vin-input {
            flex: 0 1 40ch;
            width: 40ch;
            max-width: 100%;
            min-width: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: 0.06em;
        }

        .vin-generate-btn {
            flex-shrink: 0;
            min-height: 3rem;
            padding: 0.85rem 1rem;
            white-space: nowrap;
        }

        .car-presets {
            margin: 1.25rem 0 0.35rem;
        }

        .car-presets-label {
            display: block;
            margin-bottom: 0.65rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .car-preset-btn {
            min-height: 2.75rem;
            padding: 0.7rem 1.1rem;
            border: 1px solid var(--line);
            border-radius: 0.9rem;
            background: rgba(15, 23, 42, 0.72);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 0.92rem;
        }

        .car-preset-btn:hover {
            border-color: rgba(249, 115, 22, 0.72);
            color: #fff;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="dashboard-header">
    <nav class="navbar">
        <a class="brand" th:href="@{/home}">
            <img class="brand-logo" th:src="@{/images/logo-nav.png}" alt="PitStop Garage logo" width="42" height="42">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <div class="nav-links">
            <a th:href="@{/cars}" th:text="#{nav.myCars}">My cars</a>
            <a th:href="@{/home}" th:text="#{nav.home}">Home</a>
            <a th:href="@{/logout}" th:text="#{nav.logout}">Logout</a>
            <span th:replace="~{fragments/lang-switcher :: langSwitcher}"></span>
        </div>
    </nav>
</header>

<main class="add-car-page">
    <section class="add-car-card">
        <a class="brand auth-brand" th:href="@{/cars}">
            <img class="brand-logo" th:src="@{/images/logo-nav.png}" alt="PitStop Garage logo" width="42" height="42">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <p class="eyebrow" th:text="#{carAdd.eyebrow}">Garage fleet</p>
        <h1 th:text="#{carAdd.heading}">Add car</h1>
        <p class="auth-copy" th:text="#{carAdd.copy}">Register a new vehicle to your account.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/cars/add}"
              th:object="${addCarRequest}"
              method="post"
              class="auth-form"
              novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <p class="alert error" th:if="${#fields.hasAnyErrors()}" th:text="#{form.correctFields}">
                Please correct the highlighted fields.
            </p>

            <div class="car-presets">
                <span class="car-presets-label" th:text="#{carAdd.presetsLabel}">Fill the form with a random sample car</span>
                <button type="button" id="car-preset-random-btn" class="car-preset-btn"
                        th:text="#{carAdd.presetsButton}">
                    Fill random sample car
                </button>
            </div>

            <div class="form-grid">
                <div class="full-width">
                    <label for="vin" th:text="#{carAdd.vin}">VIN</label>
                    <div class="vin-row">
                        <input id="vin" type="text" class="vin-input" th:field="*{vin}" th:errorclass="input-error"
                               th:placeholder="#{carAdd.vin.placeholder}" maxlength="17" autocomplete="off" spellcheck="false">
                        <button type="button" id="vin-generate-btn" class="button secondary vin-generate-btn"
                                th:text="#{carAdd.generateVin}">
                            Generate VIN
                        </button>
                    </div>
                    <small class="field-error" th:if="${#fields.hasErrors('vin')}"
                           th:text="${#strings.listJoin(#fields.errors('vin'), ' and ')}"></small>
                </div>

                <div class="full-width">
                    <label for="plateNumber" th:text="#{carAdd.plate}">Plate number</label>
                    <input id="plateNumber" type="text" th:field="*{plateNumber}" th:errorclass="input-error"
                           th:placeholder="#{carAdd.plate.placeholder}" maxlength="20">
                    <small class="field-error" th:if="${#fields.hasErrors('plateNumber')}"
                           th:text="${#strings.listJoin(#fields.errors('plateNumber'), ' and ')}"></small>
                </div>

                <div>
                    <label for="brand" th:text="#{carAdd.brand}">Brand</label>
                    <input id="brand" type="text" th:field="*{brand}" th:errorclass="input-error" th:placeholder="#{carAdd.brand.placeholder}">
                    <small class="field-error" th:if="${#fields.hasErrors('brand')}"
                           th:text="${#strings.listJoin(#fields.errors('brand'), ' and ')}"></small>
                </div>

                <div>
                    <label for="model" th:text="#{carAdd.model}">Model</label>
                    <input id="model" type="text" th:field="*{model}" th:errorclass="input-error" th:placeholder="#{carAdd.model.placeholder}">
                    <small class="field-error" th:if="${#fields.hasErrors('model')}"
                           th:text="${#strings.listJoin(#fields.errors('model'), ' and ')}"></small>
                </div>

                <div>
                    <label for="year" th:text="#{carAdd.year}">Year</label>
                    <input id="year" type="number" th:field="*{year}" th:errorclass="input-error"
                           th:placeholder="#{carAdd.year.placeholder}" min="1900" max="2030" step="1">
                    <small class="field-error" th:if="${#fields.hasErrors('year')}"
                           th:text="${#strings.listJoin(#fields.errors('year'), ' and ')}"></small>
                </div>

                <div>
                    <label for="mileage" th:text="#{carAdd.mileage}">Mileage (km)</label>
                    <input id="mileage" type="number" th:field="*{mileage}" th:errorclass="input-error"
                           th:placeholder="#{carAdd.mileage.placeholder}" min="0" step="1">
                    <small class="field-error" th:if="${#fields.hasErrors('mileage')}"
                           th:text="${#strings.listJoin(#fields.errors('mileage'), ' and ')}"></small>
                </div>

                <div>
                    <label for="engineType" th:text="#{carAdd.engine}">Engine type</label>
                    <select id="engineType" th:field="*{engineType}" th:errorclass="input-error">
                        <option value="" th:text="#{carAdd.selectEngine}">Select engine</option>
                        <option value="PETROL">PETROL</option>
                        <option value="DIESEL">DIESEL</option>
                        <option value="ELECTRIC">ELECTRIC</option>
                        <option value="HYBRID">HYBRID</option>
                        <option value="LPG">LPG</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('engineType')}"
                           th:text="${#strings.listJoin(#fields.errors('engineType'), ' and ')}"></small>
                </div>

                <div>
                    <label for="transmission" th:text="#{carAdd.transmission}">Transmission</label>
                    <select id="transmission" th:field="*{transmission}" th:errorclass="input-error">
                        <option value="" th:text="#{carAdd.selectTransmission}">Select transmission</option>
                        <option value="MANUAL">MANUAL</option>
                        <option value="AUTOMATIC">AUTOMATIC</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('transmission')}"
                           th:text="${#strings.listJoin(#fields.errors('transmission'), ' and ')}"></small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary" th:text="#{carAdd.submit}">Save car</button>
                <a class="button secondary" th:href="@{/cars}" th:text="#{action.cancel}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script>
    (function () {
        var VIN_CHARS = 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789';
        var PLATE_CHARS = 'ABCDEFGHJKLMNPRSTUVWXYZ';
        var vinInput = document.getElementById('vin');
        var generateBtn = document.getElementById('vin-generate-btn');
        var plateInput = document.getElementById('plateNumber');
        var brandInput = document.getElementById('brand');
        var modelInput = document.getElementById('model');
        var yearInput = document.getElementById('year');
        var mileageInput = document.getElementById('mileage');
        var engineSelect = document.getElementById('engineType');
        var transmissionSelect = document.getElementById('transmission');

        var PRESETS = [
            {
                brand: 'Audi',
                model: 'A3',
                year: 2019,
                mileage: 87000,
                engineType: 'DIESEL',
                transmission: 'AUTOMATIC',
                platePrefix: 'CA'
            },
            {
                brand: 'BMW',
                model: '320d',
                year: 2015,
                mileage: 142000,
                engineType: 'DIESEL',
                transmission: 'MANUAL',
                platePrefix: 'CB'
            },
            {
                brand: 'Volkswagen',
                model: 'Golf',
                year: 2018,
                mileage: 98000,
                engineType: 'PETROL',
                transmission: 'MANUAL',
                platePrefix: 'C'
            },
            {
                brand: 'Mercedes-Benz',
                model: 'C220',
                year: 2020,
                mileage: 61000,
                engineType: 'DIESEL',
                transmission: 'AUTOMATIC',
                platePrefix: 'PB'
            },
            {
                brand: 'Toyota',
                model: 'Corolla',
                year: 2021,
                mileage: 45000,
                engineType: 'HYBRID',
                transmission: 'AUTOMATIC',
                platePrefix: 'EH'
            }
        ];

        function generateVin() {
            var vin = '';
            for (var i = 0; i < 17; i++) {
                vin += VIN_CHARS.charAt(Math.floor(Math.random() * VIN_CHARS.length));
            }
            return vin;
        }

        function generatePlate(prefix) {
            var digits = String(Math.floor(1000 + Math.random() * 9000));
            var letters = '';
            for (var i = 0; i < 2; i++) {
                letters += PLATE_CHARS.charAt(Math.floor(Math.random() * PLATE_CHARS.length));
            }
            return prefix + digits + letters;
        }

        function setValue(el, value) {
            if (!el) {
                return;
            }
            el.value = value;
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function applyPreset(preset) {
            setValue(brandInput, preset.brand);
            setValue(modelInput, preset.model);
            setValue(yearInput, preset.year);
            setValue(mileageInput, preset.mileage);
            setValue(engineSelect, preset.engineType);
            setValue(transmissionSelect, preset.transmission);
            setValue(plateInput, generatePlate(preset.platePrefix));
            setValue(vinInput, generateVin());
        }

        function pickRandomPreset() {
            return PRESETS[Math.floor(Math.random() * PRESETS.length)];
        }

        if (generateBtn && vinInput) {
            generateBtn.addEventListener('click', function () {
                setValue(vinInput, generateVin());
                vinInput.focus();
            });
        }

        var randomPresetBtn = document.getElementById('car-preset-random-btn');
        if (randomPresetBtn) {
            randomPresetBtn.addEventListener('click', function () {
                applyPreset(pickRandomPreset());
            });
        }
    })();
</script>
</body>
</html>
