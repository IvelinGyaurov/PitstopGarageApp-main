<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{adminPartsAdd.title}">Add part - PitStop Garage</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <style>
        .add-part-page {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }

        .add-part-card {
            border: 1px solid var(--line);
            border-radius: 1.8rem;
            background:
                    linear-gradient(155deg, rgba(255, 255, 255, 0.10), transparent 46%),
                    var(--panel);
            box-shadow: var(--shadow);
            padding: 2rem;
        }

        .add-part-card h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 0.5rem;
        }

        .add-part-card .auth-copy {
            margin-bottom: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1rem;
        }

        .form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .form-actions .button {
            flex: 1;
            min-width: 140px;
            text-align: center;
        }

        .auth-form input.input-error {
            border-color: rgba(248, 113, 113, 0.85);
            box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.12);
        }

        .field-error {
            display: block;
            line-height: 1.4;
        }

        .part-presets {
            margin: 1.25rem 0 0.35rem;
        }

        .part-presets-label {
            display: block;
            margin-bottom: 0.65rem;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .button.part-preset-btn {
            min-height: 2.75rem;
            padding: 0.7rem 1.1rem;
            font-size: 0.92rem;
            color: #ecfdf5;
            border: 1px solid rgba(110, 231, 183, 0.45);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.88) 0%, rgba(5, 150, 105, 0.92) 100%);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.22);
        }

        .button.part-preset-btn:hover {
            color: #fff;
            border-color: rgba(167, 243, 208, 0.65);
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.95) 0%, rgba(16, 185, 129, 0.95) 100%);
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header class="dashboard-header">
    <nav class="navbar">
        <a class="brand" th:href="@{/home}">
            <img class="brand-logo" th:src="@{/images/logo-nav.png}" alt="PitStop Garage logo" width="42" height="42">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <div class="nav-links">
            <a th:href="@{/admin/parts}" th:text="#{nav.partsInventory}">Parts inventory</a>
            <a th:href="@{/home}" th:text="#{nav.home}">Home</a>
            <a th:href="@{/logout}" th:text="#{nav.logout}">Logout</a>
            <span th:replace="~{fragments/lang-switcher :: langSwitcher}"></span>
        </div>
    </nav>
</header>

<main class="add-part-page">
    <section class="add-part-card">
        <a class="brand auth-brand" th:href="@{/admin/parts}">
            <img class="brand-logo" th:src="@{/images/logo-nav.png}" alt="PitStop Garage logo" width="42" height="42">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <p class="eyebrow" th:text="#{adminPartsAdd.eyebrow}">Admin</p>
        <h1 th:text="#{adminPartsAdd.heading}">Add part</h1>
        <p class="auth-copy" th:text="#{adminPartsAdd.copy}">Add a new spare part to the garage inventory.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/admin/parts}"
              th:object="${addPartRequest}"
              method="post"
              class="auth-form"
              novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <p class="alert error" th:if="${#fields.hasAnyErrors()}" th:text="#{form.correctFields}">
                Please correct the highlighted fields.
            </p>

            <div class="part-presets">
                <span class="part-presets-label" th:text="#{adminPartsAdd.presetsLabel}">
                    Fill the form with a random sample part
                </span>
                <button type="button" id="part-preset-random-btn" class="button secondary part-preset-btn"
                        th:text="#{adminPartsAdd.presetsButton}">
                    Fill random sample part
                </button>
            </div>

            <div class="form-grid">
                <div class="full-width">
                    <label for="name" th:text="#{adminPartsAdd.name}">Part name</label>
                    <input id="name" type="text" th:field="*{name}" th:errorclass="input-error"
                           th:placeholder="#{adminPartsAdd.name.placeholder}" maxlength="100">
                    <small class="field-error" th:if="${#fields.hasErrors('name')}"
                           th:text="${#strings.listJoin(#fields.errors('name'), ' and ')}"></small>
                </div>

                <div class="full-width">
                    <label for="sku" th:text="#{adminParts.sku}">SKU</label>
                    <input id="sku" type="text" th:field="*{sku}" th:errorclass="input-error"
                           th:placeholder="#{adminPartsAdd.sku.placeholder}" maxlength="50">
                    <small class="field-error" th:if="${#fields.hasErrors('sku')}"
                           th:text="${#strings.listJoin(#fields.errors('sku'), ' and ')}"></small>
                </div>

                <div>
                    <label for="unitPrice" th:text="#{adminPartsAdd.unitPrice}">Unit price (EUR)</label>
                    <input id="unitPrice" type="number" th:field="*{unitPrice}" th:errorclass="input-error"
                           th:placeholder="#{adminPartsAdd.price.placeholder}" min="0.01" step="0.01">
                    <small class="field-error" th:if="${#fields.hasErrors('unitPrice')}"
                           th:text="${#strings.listJoin(#fields.errors('unitPrice'), ' and ')}"></small>
                </div>

                <div>
                    <label for="quantityInStock" th:text="#{adminPartsAdd.quantity}">Quantity in stock</label>
                    <input id="quantityInStock" type="number" th:field="*{quantityInStock}" th:errorclass="input-error"
                           th:placeholder="#{adminPartsAdd.qty.placeholder}" min="1" step="1">
                    <small class="field-error" th:if="${#fields.hasErrors('quantityInStock')}"
                           th:text="${#strings.listJoin(#fields.errors('quantityInStock'), ' and ')}"></small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button primary" th:text="#{adminPartsAdd.submit}">Save part</button>
                <a class="button secondary" th:href="@{/admin/parts}" th:text="#{action.cancel}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script>
    (function () {
        var nameInput = document.getElementById('name');
        var skuInput = document.getElementById('sku');
        var unitPriceInput = document.getElementById('unitPrice');
        var quantityInput = document.getElementById('quantityInStock');
        var randomBtn = document.getElementById('part-preset-random-btn');

        var PRESETS = [
            { name: 'Oil Filter', skuPrefix: 'OF', unitPrice: 18.50, quantityInStock: 40 },
            { name: 'Air Filter', skuPrefix: 'AF', unitPrice: 22.00, quantityInStock: 35 },
            { name: 'Spark Plug', skuPrefix: 'SP', unitPrice: 9.90, quantityInStock: 80 },
            { name: 'Brake Pad Set', skuPrefix: 'BP', unitPrice: 65.00, quantityInStock: 20 },
            { name: 'Turbocharger', skuPrefix: 'TB', unitPrice: 420.00, quantityInStock: 4 },
            { name: 'Timing Belt', skuPrefix: 'TM', unitPrice: 55.00, quantityInStock: 15 },
            { name: 'Fuel Pump', skuPrefix: 'FP', unitPrice: 145.00, quantityInStock: 8 },
            { name: 'Radiator', skuPrefix: 'RD', unitPrice: 180.00, quantityInStock: 6 },
            { name: 'Clutch Kit', skuPrefix: 'CK', unitPrice: 260.00, quantityInStock: 5 },
            { name: 'Alternator', skuPrefix: 'AL', unitPrice: 210.00, quantityInStock: 7 }
        ];

        function setValue(el, value) {
            if (!el) {
                return;
            }
            el.value = value;
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function generateSku(prefix) {
            var number = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            return prefix + '-' + number;
        }

        function applyPreset(preset) {
            setValue(nameInput, preset.name);
            setValue(skuInput, generateSku(preset.skuPrefix));
            setValue(unitPriceInput, preset.unitPrice.toFixed(2));
            setValue(quantityInput, preset.quantityInStock);
        }

        function pickRandomPreset() {
            return PRESETS[Math.floor(Math.random() * PRESETS.length)];
        }

        if (randomBtn) {
            randomBtn.addEventListener('click', function () {
                applyPreset(pickRandomPreset());
            });
        }
    })();
</script>
</body>
</html>
