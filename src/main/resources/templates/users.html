<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - PitStop Garage</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <style>
        .users-page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .users-page-header h1 {
            font-size: clamp(2.2rem, 4vw, 3.6rem);
            margin-bottom: 0.5rem;
        }

        .users-count {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .users-table-wrap {
            border: 1px solid var(--line);
            border-radius: 1.6rem;
            background:
                    linear-gradient(155deg, rgba(255, 255, 255, 0.08), transparent 42%),
                    var(--panel);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table thead {
            background: rgba(15, 23, 42, 0.55);
        }

        .users-table th,
        .users-table td {
            padding: 1rem 1.15rem;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        .users-table th {
            color: #fdba74;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .users-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .users-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .role-badge {
            display: inline-flex;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .role-badge.admin {
            color: #fde68a;
            border: 1px solid rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.12);
        }

        .role-badge.mechanic {
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.35);
            background: rgba(59, 130, 246, 0.12);
        }

        .role-badge.user {
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.35);
            background: rgba(34, 197, 94, 0.12);
        }

        .status-badge {
            display: inline-flex;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 800;
        }

        .status-badge.active {
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.35);
            background: rgba(34, 197, 94, 0.12);
        }

        .status-badge.inactive {
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.35);
            background: rgba(127, 29, 29, 0.35);
        }

        .status-cell {
            vertical-align: middle;
            white-space: nowrap;
        }

        .status-action-cell {
            width: 8.75rem;
            vertical-align: middle;
        }

        .role-actions-cell {
            width: 17.5rem;
            vertical-align: middle;
        }

        .role-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            align-items: stretch;
        }

        .status-action-form,
        .role-action-form {
            margin: 0;
            display: flex;
            min-width: 0;
        }

        .status-switch-btn,
        .role-switch-btn {
            width: 100%;
            min-height: 2.35rem;
            padding: 0.45rem 0.5rem;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            white-space: nowrap;
            text-align: center;
            box-sizing: border-box;
        }

        .status-switch-btn.status-deactivate {
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.45);
            background: rgba(127, 29, 29, 0.35);
        }

        .status-switch-btn.status-deactivate:hover {
            background: rgba(127, 29, 29, 0.5);
        }

        .status-switch-btn.status-activate {
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.45);
            background: rgba(34, 197, 94, 0.12);
        }

        .status-switch-btn.status-activate:hover {
            background: rgba(34, 197, 94, 0.22);
        }

        .status-switch-btn:disabled,
        .status-switch-btn.status-switch-disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.9);
            color: #94a3b8 !important;
            border-color: rgba(148, 163, 184, 0.35) !important;
            background: rgba(148, 163, 184, 0.1) !important;
        }

        .status-switch-btn:disabled:hover,
        .status-switch-btn.status-switch-disabled:hover {
            background: rgba(148, 163, 184, 0.1) !important;
        }

        .empty-state {
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--muted);
        }

        .role-switch-btn.role-switch-user {
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.45);
            background: rgba(34, 197, 94, 0.12);
        }

        .role-switch-btn.role-switch-user:hover {
            background: rgba(34, 197, 94, 0.22);
        }

        .role-switch-btn.role-switch-mechanic {
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.45);
            background: rgba(59, 130, 246, 0.12);
        }

        .role-switch-btn.role-switch-mechanic:hover {
            background: rgba(59, 130, 246, 0.22);
        }

        .role-switch-btn.role-switch-admin {
            color: #fde68a;
            border: 1px solid rgba(251, 191, 36, 0.45);
            background: rgba(251, 191, 36, 0.12);
        }

        .role-switch-btn.role-switch-admin:hover {
            background: rgba(251, 191, 36, 0.22);
        }

        .role-switch-btn:disabled,
        .role-switch-btn.role-switch-disabled {
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(0.9);
            color: #94a3b8 !important;
            border-color: rgba(148, 163, 184, 0.35) !important;
            background: rgba(148, 163, 184, 0.1) !important;
        }

        .role-switch-btn:disabled:hover,
        .role-switch-btn.role-switch-disabled:hover {
            background: rgba(148, 163, 184, 0.1) !important;
        }

        @media (max-width: 900px) {
            .users-table-wrap {
                overflow-x: auto;
            }

            .users-table {
                min-width: 980px;
            }
        }
    </style>
</head>
<body>
<header class="dashboard-header">
    <nav class="navbar">
        <a class="brand" th:href="@{/home}">
            <img class="brand-logo" th:src="@{/images/logo-nav.png}" alt="PitStop Garage logo" width="42" height="42">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <div class="nav-links">
            <a th:href="@{/home}" th:text="#{nav.home}">Home</a>
            <a th:href="@{/logout}" th:text="#{nav.logout}">Logout</a>
            <span th:replace="~{fragments/lang-switcher :: langSwitcher}"></span>
        </div>
    </nav>
</header>

<main class="dashboard">
    <section class="users-page-header">
        <div>
            <p class="eyebrow" th:text="#{users.eyebrow}">Administration</p>
            <h1 th:text="#{users.heading}">All users</h1>
            <p class="users-count"
               th:text="#{users.count(${users != null ? #lists.size(users) : 0})}">0 registered users</p>
        </div>
    </section>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="users-table-wrap" th:if="${users != null and !users.isEmpty()}">
        <table class="users-table">
            <thead>
            <tr>
                <th th:text="#{users.col.username}">Username</th>
                <th th:text="#{users.col.email}">Email</th>
                <th th:text="#{users.col.role}">Role</th>
                <th th:text="#{users.col.status}">Status</th>
                <th th:text="#{users.col.created}">Created on</th>
                <th th:text="#{users.col.action}">Action</th>
                <th th:text="#{users.col.switchRole}">Switch role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="listedUser : ${users}">
                <td th:text="${listedUser.username}">username</td>
                <td th:text="${listedUser.email}">email@example.com</td>
                <td>
                    <span class="role-badge"
                          th:classappend="${' ' + listedUser.role.name().toLowerCase()}"
                          th:text="${listedUser.role}">
                        USER
                    </span>
                </td>
                <td class="status-cell">
                    <span th:if="${listedUser.active}"
                          class="status-badge active"
                          th:text="#{status.active}">Active</span>
                    <span th:unless="${listedUser.active}"
                          class="status-badge inactive"
                          th:text="#{status.inactive}">Inactive</span>
                </td>
                <td th:text="${listedUser.createdOn != null ? #temporals.format(listedUser.createdOn, 'dd.MM.yyyy HH:mm') : '-'}">
                    01.01.2026 12:00
                </td>
                <td class="status-action-cell">
                    <form th:action="@{/users/{id}/status(id=${listedUser.id})}"
                          method="post"
                          class="status-action-form"
                          th:classappend="${soleAdminId == null or soleAdminId != listedUser.id} ? ' js-confirm-form'"
                          th:with="deactivateTitle=#{confirm.deactivateUser.title},
                                   activateTitle=#{confirm.activateUser.title},
                                   deactivateBody=#{confirm.deactivateUser.body(${listedUser.username})},
                                   activateBody=#{confirm.activateUser.body(${listedUser.username})},
                                   deactivateAction=#{confirm.deactivateUser.action},
                                   activateAction=#{confirm.activateUser.action},
                                   isSoleAdmin=${soleAdminId != null and soleAdminId == listedUser.id}"
                          th:attr="data-confirm-title=${listedUser.active} ? ${deactivateTitle} : ${activateTitle},
                                   data-confirm-message=${listedUser.active} ? ${deactivateBody} : ${activateBody},
                                   data-confirm-action=${listedUser.active} ? ${deactivateAction} : ${activateAction}"
                          th:onsubmit="${isSoleAdmin} ? 'return false;' : null">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="active" th:value="${!listedUser.active}">
                        <button type="submit"
                                class="button status-switch-btn"
                                th:with="lastAdminStatusTitle=#{users.title.lastAdminStatus}"
                                th:classappend="${isSoleAdmin ? ' status-switch-disabled' : (listedUser.active ? ' status-deactivate' : ' status-activate')}"
                                th:disabled="${isSoleAdmin}"
                                th:title="${isSoleAdmin} ? ${lastAdminStatusTitle} : null">
                            <span th:if="${listedUser.active}" th:text="#{users.deactivate}">Deactivate</span>
                            <span th:unless="${listedUser.active}" th:text="#{users.activate}">Activate</span>
                        </button>
                    </form>
                </td>
                <td class="role-actions-cell">
                    <div class="role-actions">
                        <form th:each="roleOption : ${T(com.pitstop.garage.user.model.UserRole).values()}"
                              th:if="${roleOption != listedUser.role}"
                              th:action="@{/users/{id}/role(id=${listedUser.id})}"
                              method="post"
                              class="role-action-form"
                              th:classappend="${listedUser.active and (soleAdminId == null or soleAdminId != listedUser.id)} ? ' js-confirm-form'"
                              th:attr="data-confirm-title=#{confirm.changeRole.title},
                                       data-confirm-message=#{confirm.changeRole.body(${listedUser.username}, ${roleOption.name()})},
                                       data-confirm-action=#{confirm.changeRole.action}"
                              th:onsubmit="${listedUser.active and (soleAdminId == null or soleAdminId != listedUser.id)} ? null : 'return false;'">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="role" th:value="${roleOption}">
                            <button type="submit"
                                    class="button role-switch-btn"
                                    th:with="lastAdminRoleTitle=#{users.title.lastAdminRole}, inactiveRoleTitle=#{users.title.inactiveRole}"
                                    th:classappend="${' role-switch-' + #strings.toLowerCase(roleOption.name()) + ((!listedUser.active or (soleAdminId != null and soleAdminId == listedUser.id)) ? ' role-switch-disabled' : '')}"
                                    th:disabled="${!listedUser.active or (soleAdminId != null and soleAdminId == listedUser.id)}"
                                    th:title="${soleAdminId != null and soleAdminId == listedUser.id} ? ${lastAdminRoleTitle} : (!listedUser.active ? ${inactiveRoleTitle} : null)"
                                    th:text="#{users.makeRole(${roleOption.name()})}">
                                Make USER
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="users-table-wrap" th:if="${users == null or users.isEmpty()}">
        <p class="empty-state" th:text="#{users.empty}">No users found.</p>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/confirm-modal :: confirmModal}"></div>
<script th:src="@{/js/confirm-modal.js}"></script>
</body>
</html>
