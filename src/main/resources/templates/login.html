<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login - PitStop Garage</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
</head>
<body>
<main class="auth-page">
    <div class="auth-lang">
        <span th:replace="~{fragments/lang-switcher :: langSwitcher}"></span>
    </div>

    <section class="auth-card">
        <a class="brand auth-brand" th:href="@{/index}">
            <img class="brand-logo" th:src="@{/images/logo-auth.png}" alt="PitStop Garage logo" width="54" height="54">
            <span th:text="#{app.name}">PitStop Garage</span>
        </a>

        <p class="eyebrow" th:text="#{login.eyebrow}">Welcome back</p>
        <h1 th:text="#{login.heading}">Login</h1>
        <p class="auth-copy" th:text="#{login.copy}">Sign in to continue managing your garage visits.</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="auth-form">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="username" th:text="#{login.username}">Username</label>
            <input id="username" type="text" th:field="*{username}" th:placeholder="#{login.username.placeholder}">
            <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>

            <label for="password" th:text="#{login.password}">Password</label>
            <input id="password" type="password" th:field="*{password}" th:placeholder="#{login.password.placeholder}">
            <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

            <button type="submit" class="button primary full-width" th:text="#{login.submit}">Login</button>
        </form>

        <p class="footer-link">
            <span th:text="#{login.noAccount}">Do not have an account?</span>
            <a th:href="@{/register}" th:text="#{login.registerHere}">Register here</a>
        </p>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
